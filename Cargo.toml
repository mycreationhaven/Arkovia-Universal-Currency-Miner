[package]
name = "arkovia-universal-currency-miner"
version = "0.1.0"
edition = "2021"
license = "JPL-1.2"
description = "CPU miner for mintable currencies on the Arkovia Blockchain"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
num_cpus = "1.16"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scrypt = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.12"
