name: Release builds

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            binary: arkovia-universal-currency-miner
          - name: windows-x64
            os: windows-latest
            binary: arkovia-universal-currency-miner.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/arkovia-universal-currency-miner-linux-x64/docs package/arkovia-universal-currency-miner-linux-x64/signer
          cp target/release/arkovia-universal-currency-miner package/arkovia-universal-currency-miner-linux-x64/
          cp miner.example.toml run-linux.sh README.md package/arkovia-universal-currency-miner-linux-x64/
          cp docs/*.md package/arkovia-universal-currency-miner-linux-x64/docs/
          cp signer/*.sh package/arkovia-universal-currency-miner-linux-x64/signer/
          tar -C package -czf arkovia-universal-currency-miner-linux-x64.tar.gz arkovia-universal-currency-miner-linux-x64
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/arkovia-universal-currency-miner-windows-x64/docs, package/arkovia-universal-currency-miner-windows-x64/signer | Out-Null
          Copy-Item target/release/arkovia-universal-currency-miner.exe, miner.example.toml, run-windows.bat, README.md package/arkovia-universal-currency-miner-windows-x64/
          Copy-Item docs/*.md package/arkovia-universal-currency-miner-windows-x64/docs/
          Copy-Item signer/*.ps1 package/arkovia-universal-currency-miner-windows-x64/signer/
          Compress-Archive -Path package/arkovia-universal-currency-miner-windows-x64 -DestinationPath arkovia-universal-currency-miner-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
